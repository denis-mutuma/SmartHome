name: Desktop

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows Desktop
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install Qt and MinGW
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125
        with:
          version: '6.11.2'
          arch: win64_mingw
          tools: tools_mingw1310
          dir: ${{ runner.temp }}
          cache: true
      - name: Configure
        run: >-
          cmake --preset desktop-debug
          "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR"
          "-DCMAKE_CXX_COMPILER=$env:IQTA_TOOLS/mingw1310_64/bin/g++.exe"
      - name: Build app and tests
        run: cmake --build --preset desktop-debug --parallel 2
      - name: QML lint
        run: cmake --build --preset desktop-debug --target appSmartHome_qmllint
      - name: Test
        run: ctest --preset desktop-debug
